<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Six US public companies, reported to SEC EDGAR</title>
    <meta
      name="description"
      content="Annual and quarterly revenue, net income, assets, liabilities and equity for six well-known US public companies, read from the SEC's XBRL company-facts API and drawn with Lattice Grid loaded by script tag: no install, no build, no type=&quot;module&quot;."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid's stylesheet and scripts, from the Lattice Grid CDN. Every
      address is built from the one BASE constant below, so the page names
      exactly one release and moving to another is a one-line change. STAMP
      is the cache stamp appended as ?v= to each address.
    -->
    <script>
      var BASE = 'https://cdn.latticegrid.dev/lattice-grid@1.123.3/';
      var STAMP = '20261116';
      document.write('<link rel="stylesheet" href="' + BASE + 'lattice-grid.min.css?v=' + STAMP + '">');
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>Six US public companies, reported to SEC EDGAR</h1>
        <p class="loading-message">Starting...</p>
      </div>
    </main>

    <!--
      The library, as classic script tags. No npm install, no bundler, no
      `type="module"`: each file runs as it arrives and leaves a global behind.

        lattice-grid.min.js          LatticeGrid            the grid itself
        modules/charts.min.js        LatticeGrid.createChart  (extends the core, so it must follow it)
        modules/data-router.min.js   LatticeGridDataRouter
        modules/kpi.min.js           LatticeGridKPI
        modules/tabs.min.js          LatticeGridTabs

      The order matters once: the charts module folds itself into the core
      global rather than defining its own, so the core has to be there first.
      The other three are self-contained and could go in any order.
    -->

    <script>
      ['lattice-grid', 'modules/charts', 'modules/data-router', 'modules/kpi', 'modules/tabs'].forEach(function (name) {
        document.write('<script src="' + BASE + name + '.min.js?v=' + STAMP + '"><\/script>');
      });
    </script>

    <!-- The demo's own code, in the order each file needs the one before it. -->
    <script src="./src/licence.js"></script>
    <script src="./src/edgar-feed.js"></script>
    <script src="./src/dashboard.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
